<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 364" width="760" height="364" font-family="Inter, Helvetica Neue, Arial, sans-serif" role="img" aria-label="Cost per unit by order size, recurring and total including one-time costs">
<style>.bg{fill:#fcfcfb}.t1{fill:#1d1f23}.t2{fill:#5b6170}.grid{stroke:#e6e6e3}@media (prefers-color-scheme: dark){.bg{fill:#1a1a19}.t1{fill:#ededeb}.t2{fill:#a2a6ae}.grid{stroke:#2e2e2c}}</style>
<rect class="bg" width="760" height="364"/>
<text class="t1" x="96" y="28" font-size="16" font-weight="600">Cost per unit by order size</text>
<text class="t2" x="96" y="48" font-size="12">USD, log scale. Bar = low–high range.</text>
<line class="grid" x1="96.0" y1="62" x2="96.0" y2="300" stroke-width="1"/>
<text class="t2" x="96.0" y="318" font-size="11" text-anchor="middle">$1</text>
<line class="grid" x1="304.0" y1="62" x2="304.0" y2="300" stroke-width="1"/>
<text class="t2" x="304.0" y="318" font-size="11" text-anchor="middle">$10</text>
<line class="grid" x1="512.0" y1="62" x2="512.0" y2="300" stroke-width="1"/>
<text class="t2" x="512.0" y="318" font-size="11" text-anchor="middle">$100</text>
<line class="grid" x1="720.0" y1="62" x2="720.0" y2="300" stroke-width="1"/>
<text class="t2" x="720.0" y="318" font-size="11" text-anchor="middle">$1k</text>
<text class="t1" x="84" y="92" font-size="12" text-anchor="end">1 unit</text>
<rect x="577.3" y="76" width="63.9" height="12" rx="4" fill="#3a72c0"><title>1 units · Recurring: $206–418</title></rect>
<rect x="596.9" y="92" width="93.1" height="12" rx="4" fill="#d9542b"><title>1 units · Total incl. NRE: $256–718</title></rect>
<text class="t2" x="696.1" y="102" font-size="11">$256–718</text>
<text class="t1" x="84" y="138" font-size="12" text-anchor="end">10 units</text>
<rect x="457.4" y="122" width="76.9" height="12" rx="4" fill="#3a72c0"><title>10 units · Recurring: $54.6–128</title></rect>
<rect x="511.7" y="138" width="147.1" height="12" rx="4" fill="#d9542b"><title>10 units · Total incl. NRE: $99.6–508</title></rect>
<text class="t2" x="664.8" y="148" font-size="11">$99.6–508</text>
<text class="t1" x="84" y="184" font-size="12" text-anchor="end">100 units</text>
<rect x="386.0" y="168" width="70.9" height="12" rx="4" fill="#3a72c0"><title>100 units · Recurring: $24.8–54.3</title></rect>
<rect x="571.1" y="184" width="50.8" height="12" rx="4" fill="#d9542b"><title>100 units · Total incl. NRE: $192–337</title></rect>
<text class="t2" x="627.8" y="194" font-size="11">$192–337</text>
<text class="t1" x="84" y="230" font-size="12" text-anchor="end">1,000 units</text>
<rect x="273.6" y="214" width="34.2" height="12" rx="4" fill="#3a72c0"><title>1,000 units · Recurring: $7.14–10.4</title></rect>
<rect x="428.4" y="230" width="64.3" height="12" rx="4" fill="#d9542b"><title>1,000 units · Total incl. NRE: $39.6–80.7</title></rect>
<text class="t2" x="498.7" y="240" font-size="11">$39.6–80.7</text>
<text class="t1" x="84" y="276" font-size="12" text-anchor="end">10,000 units</text>
<rect x="240.0" y="260" width="24.7" height="12" rx="4" fill="#3a72c0"><title>10,000 units · Recurring: $4.92–6.47</title></rect>
<rect x="297.2" y="276" width="49.9" height="12" rx="4" fill="#d9542b"><title>10,000 units · Total incl. NRE: $9.27–16.1</title></rect>
<text class="t2" x="353.0" y="286" font-size="11">$9.27–16.1</text>
<rect x="96" y="332" width="12" height="12" rx="3" fill="#3a72c0"/><text class="t1" x="114" y="342" font-size="12">Recurring (one more unit)</text>
<rect x="306" y="332" width="12" height="12" rx="3" fill="#d9542b"/><text class="t1" x="324" y="342" font-size="12">Total, with one-time costs spread over the order</text>
</svg>
