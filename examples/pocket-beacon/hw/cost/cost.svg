<rect x="104" y="374" width="12" height="12" rx="3" fill="#3a72c0"/><text class="t1" x="122" y="384" font-size="12">Recurring (one more unit)</text>
<rect x="330" y="374" width="12" height="12" rx="3" fill="#d9542b"/><text class="t1" x="348" y="384" font-size="12">Total, with one-time costs spread over the order</text>
<line class="tg" x1="722" y1="372" x2="722" y2="386" stroke-width="2" stroke-linecap="round"/><text class="t1" x="732" y="384" font-size="12">Target (recurring)</text>
