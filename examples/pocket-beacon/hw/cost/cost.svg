<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 406" width="900" height="406" font-family="Inter, Helvetica Neue, Arial, sans-serif" role="img" aria-label="Cost per unit by order size. Unit-cost target not proven yet at 1,000 and 10,000 units: the estimates decide">
<style>.bg{fill:#fcfcfb}.t1{fill:#1d1f23}.t2{fill:#5b6170}.grid{stroke:#e6e6e3}.tg{stroke:#1d1f23}.halo{paint-order:stroke;stroke:#fcfcfb;stroke-width:4px;stroke-linejoin:round}@media (prefers-color-scheme: dark){.bg{fill:#1a1a19}.t1{fill:#ededeb}.t2{fill:#a2a6ae}.grid{stroke:#2e2e2c}.tg{stroke:#ededeb}.halo{stroke:#1a1a19}}</style>
<rect class="bg" width="900" height="406"/>
