<text class="t2" x="104" y="52" font-size="12">Cost per unit by order size, USD, log scale. Each bar is the low–high range; the black mark is the recurring (FOB) target.</text>
<text class="t2" x="742" y="82" font-size="11" font-weight="600">TARGET</text>
